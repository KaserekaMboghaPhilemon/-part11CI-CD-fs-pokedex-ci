name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run once a day to avoid consuming free hours

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check URL health
        run: |
          curl -f https://part11ci-cd-fs-pokedex-ci.onrender.com || exit 1